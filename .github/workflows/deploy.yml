# Sole production deploy entrypoint.
#
#   vault-ready → reconcile (--apply --fleet-only) → railway-deploy? → health-check-all
#
# Triggers:
#   - workflow_call (from ci.yml)
#   - repository_dispatch deploy-service (sibling publish-image)
#   - workflow_dispatch (manual)
#
# Secrets: Vault OIDC via .github/actions/vault-secrets (not GitHub repo secrets).

name: Deploy

on:
  workflow_call:
    inputs:
      service_id:
        description: "Single service id (empty = all deployable services)."
        required: false
        type: string
        default: ""
      image_tag:
        description: "Image tag to deploy."
        required: false
        type: string
        default: latest
      redeploy:
        description: "Roll Railway services to image_tag."
        required: false
        type: boolean
        default: false
      apply_dns:
        description: "Apply Cloudflare DNS / redirect / alias changes."
        required: false
        type: boolean
        default: true
  repository_dispatch:
    types:
      - deploy-service
  workflow_dispatch:
    inputs:
      service_id:
        description: "Single service id (empty = all services)."
        required: false
        type: string
      image_tag:
        description: "Image tag to deploy. Defaults to latest."
        required: false
        type: string
        default: latest
      apply_dns:
        description: "Apply Cloudflare DNS changes."
        required: false
        type: boolean
        default: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  packages: write

env:
  SERVICE_ID: ${{ github.event.client_payload.id || inputs.service_id || '' }}
  IMAGE_TAG: ${{ github.event.client_payload.image_tag || inputs.image_tag || 'latest' }}
  VAULT_ADDR: https://vault.chrisvouga.dev

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      service_id: ${{ steps.resolve.outputs.service_id }}
      service_ids: ${{ steps.resolve.outputs.service_ids }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      redeploy: ${{ steps.resolve.outputs.redeploy }}
      apply_dns: ${{ steps.resolve.outputs.apply_dns }}
      wait_for_certs: ${{ steps.resolve.outputs.wait_for_certs }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REDEPLOY: ${{ inputs.redeploy }}
          INPUT_APPLY_DNS: ${{ inputs.apply_dns }}
        run: |
          set -euo pipefail
          SID="${SERVICE_ID}"
          TAG="${IMAGE_TAG}"
          if [ -n "${SID}" ]; then
            SERVICE_IDS="$(bun run packages/infra/scripts/list-deploy-service-ids.ts --id "${SID}")"
          else
            SERVICE_IDS="$(bun run packages/infra/scripts/list-deploy-service-ids.ts)"
          fi

          REDEPLOY=false
          WAIT_FOR_CERTS=false
          if [ "${EVENT_NAME}" = "repository_dispatch" ] || [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            REDEPLOY=true
            WAIT_FOR_CERTS=true
          elif [ "${INPUT_REDEPLOY}" = "true" ]; then
            REDEPLOY=true
            WAIT_FOR_CERTS=true
          fi

          APPLY_DNS=true
          if [ "${INPUT_APPLY_DNS}" = "false" ]; then
            APPLY_DNS=false
          fi

          echo "service_id=${SID}" >> "$GITHUB_OUTPUT"
          echo "service_ids=${SERVICE_IDS}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "redeploy=${REDEPLOY}" >> "$GITHUB_OUTPUT"
          echo "apply_dns=${APPLY_DNS}" >> "$GITHUB_OUTPUT"
          echo "wait_for_certs=${WAIT_FOR_CERTS}" >> "$GITHUB_OUTPUT"
          echo "Deploy: service_id='${SID:-all}' services=${SERVICE_IDS} image_tag='${TAG}' redeploy=${REDEPLOY}"

  vault-ready:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vault to be unsealed
        run: |
          set -euo pipefail
          addr="${VAULT_ADDR}"
          echo "Waiting for Vault at ${addr}..."
          for i in $(seq 1 180); do
            code="$(curl -s -o /dev/null -w '%{http_code}' \
              "${addr}/v1/sys/health?standbyok=true&perfstandbyok=true" || true)"
            case "$code" in
              200|429|472|473)
                echo "Vault is unsealed (HTTP ${code})"
                exit 0
                ;;
              503)
                echo "Vault sealed — retry ${i}/180..."
                ;;
              *)
                echo "Vault not ready (HTTP ${code:-000}) — retry ${i}/180..."
                ;;
            esac
            sleep 5
          done
          echo "::error::Vault at ${addr} did not become unsealed within 15 minutes"
          exit 1

  reconcile:
    runs-on: ubuntu-latest
    needs: [prepare, vault-ready]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run packages/infra/scripts/print-platform-env.ts --format github >> "$GITHUB_ENV"
      - uses: ./.github/actions/vault-secrets
        with:
          vault_addr: ${{ env.VAULT_ADDR }}
      - name: Reconcile fleet desired state
        env:
          RAILWAY_TOKEN: ${{ env.RAILWAY_TOKEN }}
          APPLY_DNS: ${{ needs.prepare.outputs.apply_dns }}
        run: |
          set -euo pipefail
          if [ "${APPLY_DNS}" = "true" ]; then
            bun run reconcile --apply --fleet-only
          else
            bun run reconcile --apply --fleet-only --phase railway --phase ghcr
          fi
      - name: Wait for TLS certs
        if: needs.prepare.outputs.wait_for_certs == 'true' && needs.prepare.outputs.apply_dns == 'true'
        env:
          RAILWAY_TOKEN: ${{ env.RAILWAY_TOKEN }}
        run: bun run sync-dns --apply --wait-for-certs

  railway-deploy:
    if: needs.prepare.outputs.redeploy == 'true'
    runs-on: ubuntu-latest
    needs: [prepare, vault-ready, reconcile]
    strategy:
      fail-fast: false
      matrix:
        service_id: ${{ fromJson(needs.prepare.outputs.service_ids) }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run packages/infra/scripts/print-platform-env.ts --format github >> "$GITHUB_ENV"
      - uses: ./.github/actions/vault-secrets
        with:
          vault_addr: ${{ env.VAULT_ADDR }}
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ env.RAILWAY_TOKEN }}
          GH_TOKEN: ${{ env.GITHUB_TOKEN_SUPER || github.token }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "ERROR: RAILWAY_TOKEN is required" >&2
            exit 1
          fi
          bun run deploy-railway \
            --id "${{ matrix.service_id }}" \
            --image-tag "${{ needs.prepare.outputs.image_tag }}"
      - name: Health-check service
        if: success()
        run: bun run health-check --id "${{ matrix.service_id }}"

  health-check-all:
    runs-on: ubuntu-latest
    needs: [prepare, vault-ready, reconcile, railway-deploy]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      needs.vault-ready.result == 'success' &&
      needs.reconcile.result == 'success' &&
      (needs.railway-deploy.result == 'success' || needs.railway-deploy.result == 'skipped')
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run packages/infra/scripts/print-platform-env.ts --format github >> "$GITHUB_ENV"
      - uses: ./.github/actions/vault-secrets
        with:
          vault_addr: ${{ env.VAULT_ADDR }}
      - name: Health-check all public services
        run: bun run health-check --all-public
