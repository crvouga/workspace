# Single workflow for the whole monorepo pipeline — no reusable sibling workflows.
#
#   push (main) / production dispatch .... vault-state → vault? → check → publish? → deploy
#   workflow_dispatch ...... manual check / publish / vault rebuild / fleet redeploy
#   workflow_call .......... sibling app repos publish their image (was publish-image.yml)
#   repository_dispatch .... sibling publish notify → fleet deploy (deploy-service)
#
# Secrets: Vault OIDC for check/smoke/deploy; GitHub repo secrets for vault bootstrap only.

name: CI

permissions:
  contents: read
  id-token: write
  packages: write
  pull-requests: read

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".vscode/**"
      - ".cursor/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".vscode/**"
      - ".cursor/**"
  workflow_dispatch:
    inputs:
      publish:
        description: Build/push turborepo GHCR image and redeploy
        type: boolean
        default: false
      unseal_only:
        description: Skip vault migrate/build/deploy; still DNS + unseal + fleet reconcile
        type: boolean
        default: false
      service_id:
        description: "Manual fleet redeploy: single service id (empty = all)"
        required: false
        type: string
      image_tag:
        description: "Manual fleet redeploy image tag"
        required: false
        type: string
        default: latest
      apply_dns:
        description: Apply Cloudflare DNS / redirect / alias changes
        type: boolean
        default: true
  repository_dispatch:
    types:
      - deploy-service
  workflow_call:
    inputs:
      service_id:
        description: "Service id matching services.yaml (e.g. portfolio, todo-app)."
        required: true
        type: string
      dockerfile:
        description: "Path to Dockerfile relative to context."
        required: false
        type: string
        default: ./Dockerfile
      context:
        description: "Docker build context."
        required: false
        type: string
        default: .
      image_owner:
        description: "ghcr.io owner."
        required: false
        type: string
        default: crvouga
      image_prefix:
        description: "GHCR package prefix (from services.yaml image_prefix)."
        required: false
        type: string
        default: chrisvouga
      infra_github_repo:
        description: "Infra repo owner/name for deploy dispatch."
        required: false
        type: string
        default: crvouga/workspace
      notify_deploy:
        description: "POST repository_dispatch to infra after push. Set false when chaining deploy."
        required: false
        type: boolean
        default: true
    secrets:
      DEPLOY_DISPATCH_TOKEN:
        description: "PAT or GITHUB_TOKEN with repo dispatch to the infra repo."
        required: false
      CALLER_GITHUB_TOKEN:
        description: "Caller workflow github.token — required for GHCR push from cross-repo calls."
        required: false
      RAILWAY_TOKEN:
        description: "Repo secret — vault bootstrap job only (not passed by callers)."
        required: false
      CF_API_TOKEN:
        description: "Repo secret — vault bootstrap job only (not passed by callers)."
        required: false
      DB_CONNECTION_URI:
        description: "Repo secret — vault bootstrap job only (not passed by callers)."
        required: false
    outputs:
      image_tag:
        description: "Image tag pushed (commit SHA)."
        value: ${{ jobs.publish.outputs.image_tag }}
      service_id:
        description: "Service id that was published."
        value: ${{ jobs.publish.outputs.service_id }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VAULT_ADDR: https://vault.chrisvouga.dev

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      check: ${{ steps.flags.outputs.check }}
      vault: ${{ steps.flags.outputs.vault }}
      publish: ${{ steps.flags.outputs.publish }}
      deploy: ${{ steps.flags.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          filters: |
            check:
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'tsconfig.json'
              - 'tsconfig.strict.json'
              - '.prettierrc'
              - '.prettierignore'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            vault:
              - 'packages/vault-service/**'
            publish:
              - 'packages/turborepo-remote-cache/**'
              - 'packages/assert/**'
              - 'packages/logger/**'
              - 'packages/object-store/**'
              - 'packages/secret-store/**'
              - 'packages/secret-string/**'
              - 'packages/vault/**'
              - 'packages/eslint-rules/package.json'
              - '.dockerignore'
              - 'bun.lock'
              - 'turbo.json'
              - 'tsconfig.json'
            deploy:
              - 'packages/infra/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/vault-secrets/**'
      - id: flags
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_UNSEAL: ${{ inputs.unseal_only }}
          INPUT_SERVICE_ID: ${{ inputs.service_id }}
          FILTER_CHECK: ${{ steps.filter.outputs.check }}
          FILTER_VAULT: ${{ steps.filter.outputs.vault }}
          FILTER_PUBLISH: ${{ steps.filter.outputs.publish }}
          FILTER_DEPLOY: ${{ steps.filter.outputs.deploy }}
        run: |
          set -euo pipefail
          CHECK=false
          VAULT=false
          PUBLISH=false
          DEPLOY=false

          if [ "${EVENT_NAME}" = "workflow_call" ]; then
            # Sibling repo publishes its image through this workflow; nothing else runs.
            PUBLISH=true
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${INPUT_PUBLISH}" = "true" ]; then
              CHECK=true
              PUBLISH=true
              DEPLOY=true
            fi
            if [ "${INPUT_UNSEAL}" = "true" ]; then
              VAULT=true
              DEPLOY=true
            fi
            if [ -n "${INPUT_SERVICE_ID}" ]; then
              DEPLOY=true
            fi
            # Manual dispatch with no flags: still allow smoke; no gate jobs
          elif [ "${EVENT_NAME}" = "repository_dispatch" ]; then
            DEPLOY=true
          elif [ "${EVENT_NAME}" = "pull_request" ]; then
            CHECK="${FILTER_CHECK:-false}"
          else
            # push to main
            CHECK="${FILTER_CHECK:-false}"
            VAULT="${FILTER_VAULT:-false}"
            PUBLISH="${FILTER_PUBLISH:-false}"
            DEPLOY="${FILTER_DEPLOY:-false}"
            if [ "${VAULT}" = "true" ] || [ "${PUBLISH}" = "true" ]; then
              DEPLOY=true
            fi
          fi

          {
            echo "check=${CHECK}"
            echo "vault=${VAULT}"
            echo "publish=${PUBLISH}"
            echo "deploy=${DEPLOY}"
          } >> "$GITHUB_OUTPUT"
          echo "flags check=${CHECK} vault=${VAULT} publish=${PUBLISH} deploy=${DEPLOY}"

  vault-state:
    if: |
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'repository_dispatch'
      )
    runs-on: ubuntu-latest
    outputs:
      bootstrap: ${{ steps.health.outputs.bootstrap }}
    steps:
      - id: health
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            "${VAULT_ADDR}/v1/sys/health?standbyok=true&perfstandbyok=true" || true)"
          case "${code}" in
            200|429|472|473)
              echo "Vault is unsealed (HTTP ${code}); bootstrap not required"
              echo "bootstrap=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Vault requires bootstrap (HTTP ${code:-000}); vault job will deploy and unseal it"
              echo "bootstrap=true" >> "$GITHUB_OUTPUT"
              ;;
          esac


  check:
    needs: [changes, vault]
    if: |
      always() &&
      needs.changes.outputs.check == 'true' &&
      (needs.vault.result == 'success' || needs.vault.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Import Vault secrets (dev)
        uses: ./.github/actions/turborepo-vault-secrets
        with:
          vault_config: dev
      - name: Verify Vault secrets (dev)
        env:
          CI: true
          GITHUB_ACTIONS: true
          VAULT_CONFIG: dev
          VAULT_PROJECT: personal
        run: bun run --filter @pkgs/turborepo-remote-cache check:vault-secrets
      - name: Smoke test secrets (dev)
        env:
          CI: true
          GITHUB_ACTIONS: true
          VAULT_CONFIG: dev
          VAULT_PROJECT: personal
        run: bun run --filter @pkgs/turborepo-remote-cache smoke:secrets
      - name: Turbo CI (format, tc, lint, test, build)
        run: bun run check

  publish:
    needs: [changes]
    if: needs.changes.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      service_id: ${{ steps.resolve.outputs.service_id }}
    steps:
      - id: tag
        run: echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5

      - name: Resolve build inputs
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_SERVICE_ID: ${{ inputs.service_id }}
          IN_DOCKERFILE: ${{ inputs.dockerfile }}
          IN_CONTEXT: ${{ inputs.context }}
          IN_OWNER: ${{ inputs.image_owner }}
          IN_PREFIX: ${{ inputs.image_prefix }}
          IN_NOTIFY: ${{ inputs.notify_deploy }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_call" ]; then
            SID="${IN_SERVICE_ID}"
            DOCKERFILE="${IN_DOCKERFILE}"
            CONTEXT="${IN_CONTEXT}"
            OWNER="${IN_OWNER}"
            PREFIX="${IN_PREFIX}"
            NOTIFY="${IN_NOTIFY}"
          else
            # Monorepo path: the turborepo remote cache image.
            SID=turborepo
            DOCKERFILE=packages/turborepo-remote-cache/Dockerfile
            CONTEXT=.
            OWNER=crvouga
            PREFIX=chrisvouga
            NOTIFY=false
          fi
          for v in "${SID}" "${DOCKERFILE}" "${CONTEXT}" "${OWNER}" "${PREFIX}"; do
            if [ -z "${v}" ]; then
              echo "::error::publish inputs must be non-empty" >&2
              exit 1
            fi
          done
          {
            echo "service_id=${SID}"
            echo "dockerfile=${DOCKERFILE}"
            echo "context=${CONTEXT}"
            echo "image_owner=${OWNER}"
            echo "image_prefix=${PREFIX}"
            echo "notify_deploy=${NOTIFY}"
          } >> "$GITHUB_OUTPUT"
          echo "publish ${OWNER}/${PREFIX}-${SID} dockerfile=${DOCKERFILE} context=${CONTEXT} notify=${NOTIFY}"

      - name: Resolve GHCR credentials
        id: ghcr_auth
        env:
          DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          CALLER_TOKEN: ${{ secrets.CALLER_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if { [ "${GITHUB_REPOSITORY}" = "crvouga/infra" ] || [ "${GITHUB_REPOSITORY}" = "crvouga/workspace" ]; } && [ -n "${DISPATCH_TOKEN}" ]; then
            echo "username=${{ steps.resolve.outputs.image_owner }}" >> "$GITHUB_OUTPUT"
            echo "password=${DISPATCH_TOKEN}" >> "$GITHUB_OUTPUT"
          elif [ -n "${CALLER_TOKEN}" ]; then
            echo "username=${{ github.actor }}" >> "$GITHUB_OUTPUT"
            echo "password=${CALLER_TOKEN}" >> "$GITHUB_OUTPUT"
          else
            echo "username=${{ github.actor }}" >> "$GITHUB_OUTPUT"
            echo "password=${{ github.token }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to ghcr.io
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ steps.ghcr_auth.outputs.username }}
          password: ${{ steps.ghcr_auth.outputs.password }}

      - uses: docker/setup-buildx-action@v4.0.0

      - name: Build and push
        uses: docker/build-push-action@v7.2.0
        with:
          context: ${{ steps.resolve.outputs.context }}
          file: ${{ steps.resolve.outputs.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ steps.resolve.outputs.image_owner }}/${{ steps.resolve.outputs.image_prefix }}-${{ steps.resolve.outputs.service_id }}:latest
            ghcr.io/${{ steps.resolve.outputs.image_owner }}/${{ steps.resolve.outputs.image_prefix }}-${{ steps.resolve.outputs.service_id }}:${{ github.sha }}

      - name: Make package public
        env:
          GH_TOKEN: ${{ steps.ghcr_auth.outputs.password }}
          PKG: ${{ steps.resolve.outputs.image_prefix }}-${{ steps.resolve.outputs.service_id }}
          OWNER: ${{ steps.resolve.outputs.image_owner }}
        run: |
          set -euo pipefail
          for URL in \
            "https://api.github.com/user/packages/container/${PKG}/visibility" \
            "https://api.github.com/orgs/${OWNER}/packages/container/${PKG}/visibility"
          do
            STATUS=$(curl -s -o /tmp/ghcr-vis-body.txt -w "%{http_code}" \
              -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -d '{"visibility":"public"}' \
              "${URL}")
            if [ "${STATUS}" -ge 200 ] && [ "${STATUS}" -lt 300 ]; then
              echo "Package ${PKG} is public (${URL})"
              exit 0
            fi
            if [ "${STATUS}" != "404" ]; then
              echo "Warning: could not set ${PKG} public via ${URL} (HTTP ${STATUS})"
              cat /tmp/ghcr-vis-body.txt || true
            fi
          done
          echo "Package ${PKG} visibility not updated (may not exist yet on first push)"

      - name: Notify infra deploy
        if: steps.resolve.outputs.notify_deploy == 'true'
        env:
          DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          INFRA_REPO: ${{ inputs.infra_github_repo }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_TOKEN}" ]; then
            echo "ERROR: DEPLOY_DISPATCH_TOKEN is not set on this repo" >&2
            echo "Run: GITHUB_TOKEN_SUPER=... bun run rollout-publish -- --repo ${{ github.repository }} --set-org-dispatch-secret" >&2
            exit 1
          fi
          HTTP=$(curl -sS -o /tmp/dispatch-body.txt -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${INFRA_REPO}/dispatches" \
            -d "{\"event_type\":\"deploy-service\",\"client_payload\":{\"id\":\"${{ steps.resolve.outputs.service_id }}\",\"image_tag\":\"${{ github.sha }}\"}}")
          if [ "${HTTP}" -ge 200 ] && [ "${HTTP}" -lt 300 ]; then
            echo "Dispatched deploy-service for ${{ steps.resolve.outputs.service_id }}@${{ github.sha }}"
            exit 0
          fi
          echo "Deploy dispatch failed (HTTP ${HTTP}):" >&2
          cat /tmp/dispatch-body.txt >&2
          if [ "${HTTP}" = "403" ]; then
            echo "Set DEPLOY_DISPATCH_TOKEN on this repo (GITHUB_TOKEN_SUPER PAT with repo scope)." >&2
          fi
          exit 1

  vault:
    needs: [changes, vault-state]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (
        needs.changes.outputs.vault == 'true' ||
        inputs.unseal_only == true ||
        needs.vault-state.outputs.bootstrap == 'true'
      )
    runs-on: ubuntu-latest
    concurrency:
      group: vault-${{ github.ref }}
      cancel-in-progress: false
    env:
      VAULT_ADDR: https://vault.chrisvouga.dev
      VAULT_HOSTNAME: vault.chrisvouga.dev
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      DB_CONNECTION_URI: ${{ secrets.DB_CONNECTION_URI }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
    defaults:
      run:
        working-directory: packages/vault-service
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates lsb-release jq dnsutils
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - run: bun run packages/infra/scripts/print-platform-env.ts --format github >> "$GITHUB_ENV"
        working-directory: .

      - name: Run migrations
        if: inputs.unseal_only != true
        run: |
          set -euo pipefail
          chmod +x scripts/migrate.sh
          ./scripts/migrate.sh

      - uses: docker/setup-buildx-action@v4.0.0
        if: inputs.unseal_only != true

      - name: Log in to ghcr.io
        if: inputs.unseal_only != true
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: crvouga
          password: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}

      - name: Build and push
        if: inputs.unseal_only != true
        uses: docker/build-push-action@v7.2.0
        with:
          context: packages/vault-service
          file: packages/vault-service/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/crvouga/workspace
            org.opencontainers.image.description=Standalone OpenBao vault for chrisvouga.dev
          tags: |
            ghcr.io/crvouga/chrisvouga-vault:latest
            ghcr.io/crvouga/chrisvouga-vault:${{ github.sha }}

      - name: Make package public
        if: inputs.unseal_only != true
        working-directory: .
        run: bun run make-ghcr-public --id vault --require

      - name: Provision Railway service
        if: inputs.unseal_only != true
        run: |
          chmod +x scripts/railway-provision.sh
          ./scripts/railway-provision.sh

      - name: Deploy to Railway
        if: inputs.unseal_only != true
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          chmod +x scripts/railway-deploy.sh
          ./scripts/railway-deploy.sh

      - name: Reconcile DNS
        run: |
          chmod +x scripts/railway-sync-dns.sh
          ./scripts/railway-sync-dns.sh

      - name: Verify custom domain (pre-unseal)
        env:
          REQUIRE_HEALTHY: "false"
        run: |
          chmod +x scripts/verify-custom-domain.sh
          ./scripts/verify-custom-domain.sh

      - name: Unseal OpenBao
        run: |
          set -euo pipefail
          chmod +x scripts/install-vault-cli.sh scripts/repair-openbao-auth-mounts.sh scripts/unseal.sh
          ./scripts/install-vault-cli.sh
          ./scripts/repair-openbao-auth-mounts.sh
          ./scripts/unseal.sh

      - name: Smoke test
        run: |
          set -euo pipefail
          VAULT_TOKEN="$(./scripts/fetch-vault-token.sh)"
          export VAULT_TOKEN
          ./scripts/smoke-test.sh

      - name: Health check custom domain
        env:
          REQUIRE_HEALTHY: "true"
        run: ./scripts/verify-custom-domain.sh

      - name: Health-check vault
        working-directory: .
        run: bun run health-check --id vault

  # Fleet deploy: resolve → reconcile (--apply --fleet-only) → railway-deploy? → health-check-all
  deploy-prepare:
    needs: [changes, check, vault, publish]
    if: |
      always() &&
      needs.changes.outputs.deploy == 'true' &&
      (needs.check.result == 'success' || needs.check.result == 'skipped') &&
      (needs.vault.result == 'success' || needs.vault.result == 'skipped') &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      service_id: ${{ steps.resolve.outputs.service_id }}
      service_ids: ${{ steps.resolve.outputs.service_ids }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      redeploy: ${{ steps.resolve.outputs.redeploy }}
      apply_dns: ${{ steps.resolve.outputs.apply_dns }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLIENT_ID: ${{ github.event.client_payload.id }}
          CLIENT_IMAGE_TAG: ${{ github.event.client_payload.image_tag }}
          INPUT_SERVICE_ID: ${{ inputs.service_id }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_APPLY_DNS: ${{ inputs.apply_dns }}
          PUBLISH_SERVICE_ID: ${{ needs.publish.outputs.service_id }}
          PUBLISH_IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
        run: |
          set -euo pipefail
          # A publish in this run (monorepo turborepo image) wins; else dispatch payload.
          if [ -n "${PUBLISH_SERVICE_ID}" ]; then
            SID="${PUBLISH_SERVICE_ID}"
          else
            SID="${CLIENT_ID:-${INPUT_SERVICE_ID:-}}"
          fi
          if [ -n "${PUBLISH_IMAGE_TAG}" ]; then
            TAG="${PUBLISH_IMAGE_TAG}"
          else
            TAG="${CLIENT_IMAGE_TAG:-${INPUT_IMAGE_TAG:-latest}}"
          fi

          if [ -n "${SID}" ]; then
            SERVICE_IDS="$(bun run packages/infra/scripts/list-deploy-service-ids.ts --id "${SID}")"
          else
            SERVICE_IDS="$(bun run packages/infra/scripts/list-deploy-service-ids.ts)"
          fi

          REDEPLOY=false
          if [ "${EVENT_NAME}" = "repository_dispatch" ] || \
             [ "${EVENT_NAME}" = "workflow_dispatch" ] || \
             [ -n "${PUBLISH_IMAGE_TAG}" ]; then
            REDEPLOY=true
          fi

          APPLY_DNS=true
          if [ "${INPUT_APPLY_DNS}" = "false" ]; then
            APPLY_DNS=false
          fi

          {
            echo "service_id=${SID}"
            echo "service_ids=${SERVICE_IDS}"
            echo "image_tag=${TAG}"
            echo "redeploy=${REDEPLOY}"
            echo "apply_dns=${APPLY_DNS}"
          } >> "$GITHUB_OUTPUT"
          echo "Deploy: service_id='${SID:-all}' services=${SERVICE_IDS} image_tag='${TAG}' redeploy=${REDEPLOY}"

  deploy-reconcile:
    runs-on: ubuntu-latest
    needs: [deploy-prepare]
    if: |
      always() &&
      needs.deploy-prepare.result == 'success'
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run packages/infra/scripts/print-platform-env.ts --format github >> "$GITHUB_ENV"
      - uses: ./.github/actions/vault-secrets
        with:
          vault_addr: ${{ env.VAULT_ADDR }}
      - name: Reconcile fleet desired state
        env:
          RAILWAY_TOKEN: ${{ env.RAILWAY_TOKEN }}
          APPLY_DNS: ${{ needs.deploy-prepare.outputs.apply_dns }}
        run: |
          set -euo pipefail
          if [ "${APPLY_DNS}" = "true" ]; then
            bun run reconcile --apply --fleet-only
          else
            bun run reconcile --apply --fleet-only --phase railway --phase ghcr
          fi
      - name: Wait for TLS certs
        if: needs.deploy-prepare.outputs.redeploy == 'true' && needs.deploy-prepare.outputs.apply_dns == 'true'
        env:
          RAILWAY_TOKEN: ${{ env.RAILWAY_TOKEN }}
        run: bun run sync-dns --apply --wait-for-certs

  deploy-railway:
    if: needs.deploy-prepare.outputs.redeploy == 'true'
    runs-on: ubuntu-latest
    needs: [deploy-prepare, deploy-reconcile]
    strategy:
      fail-fast: false
      matrix:
        service_id: ${{ fromJson(needs.deploy-prepare.outputs.service_ids) }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run packages/infra/scripts/print-platform-env.ts --format github >> "$GITHUB_ENV"
      - uses: ./.github/actions/vault-secrets
        with:
          vault_addr: ${{ env.VAULT_ADDR }}
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ env.RAILWAY_TOKEN }}
          GH_TOKEN: ${{ env.GITHUB_TOKEN_SUPER || github.token }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "ERROR: RAILWAY_TOKEN is required" >&2
            exit 1
          fi
          bun run deploy-railway \
            --id "${{ matrix.service_id }}" \
            --image-tag "${{ needs.deploy-prepare.outputs.image_tag }}"
      - name: Health-check service
        if: success()
        run: bun run health-check --id "${{ matrix.service_id }}"

  health-check-all:
    runs-on: ubuntu-latest
    needs: [deploy-prepare, deploy-reconcile, deploy-railway]
    if: |
      always() &&
      needs.deploy-prepare.result == 'success' &&
      needs.deploy-reconcile.result == 'success' &&
      (needs.deploy-railway.result == 'success' || needs.deploy-railway.result == 'skipped')
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run packages/infra/scripts/print-platform-env.ts --format github >> "$GITHUB_ENV"
      - uses: ./.github/actions/vault-secrets
        with:
          vault_addr: ${{ env.VAULT_ADDR }}
      - name: Health-check all public services
        run: bun run health-check --all-public

  smoke:
    runs-on: ubuntu-latest
    needs: [changes, health-check-all]
    # Manual prod smoke only. When a deploy also runs, wait until it finishes so
    # we don't probe mid-redeploy (503 race).
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      (
        (needs.changes.outputs.deploy != 'true' && needs.health-check-all.result == 'skipped') ||
        needs.health-check-all.result == 'success'
      )
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Import Vault secrets (prd)
        uses: ./.github/actions/turborepo-vault-secrets
        with:
          vault_config: prd
      - name: Smoke test remote cache
        env:
          CI: true
          GITHUB_ACTIONS: true
          VAULT_CONFIG: prd
          VAULT_PROJECT: personal
        run: bun run --filter @pkgs/turborepo-remote-cache smoke
