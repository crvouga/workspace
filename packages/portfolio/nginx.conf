server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    error_log /tmp/nginx-error.log warn;
    access_log /tmp/nginx-access.log;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Cache static assets - must come before location /
    # Match all static file extensions
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Vary "Accept-Encoding";
        gzip_static on;
        gzip on;
        gzip_types *;
        access_log off;
        try_files $uri =404;
    }

    # The resume is rebuilt from content on every deploy, so it must never be
    # served from cache without revalidating — a recruiter would get the copy
    # from whenever they last opened the site.
    location = /chris-vouga-resume.pdf {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Cache web components directory
    location /web-components/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Vary "Accept-Encoding";
        gzip_static on;
        gzip on;
        gzip_types *;
        access_log off;
        try_files $uri =404;
    }

    # No SPA fallback: this is a multi-route static site, so an unknown path
    # must 404 rather than silently serving the homepage with a 200.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
}