<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Light table — first viewport</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;700&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; }
  .table {
    width: 1440px; height: 900px; background: #f3f0e8; color: #161616;
    font-family: "Martian Mono", monospace; padding: 28px 32px 24px;
    display: grid; grid-template-columns: 220px 1fr; gap: 22px;
  }
  .strip { display: flex; flex-direction: column; gap: 10px; }
  .frame {
    height: 118px; background: #161616; color: #f3f0e8; padding: 8px;
    display: flex; flex-direction: column; justify-content: space-between; font-size: 13px;
  }
  .frame.on { outline: 3px solid #e07a2f; outline-offset: 4px; }
  .plate { position: relative; background: #161616; overflow: hidden; }
  .plate img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .circle {
    position: absolute; left: 8%; top: 10%; width: 78%; height: 72%;
    border: 4px solid #e07a2f; border-radius: 50%;
  }
  .cap {
    position: absolute; left: 24px; bottom: 18px; background: #f3f0e8; color: #161616;
    padding: 8px 12px; font-size: 28px; font-weight: 700;
  }
  .margin {
    grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline;
    font-size: 16px;
  }
  .margin b { font-size: 22px; }
</style>
</head>
<body>
  <main class="table">
    <aside class="strip">
      <div class="frame on"><span>01</span><span>gamezilla.app</span></div>
      <div class="frame"><span>02</span><span>Geviti</span></div>
      <div class="frame"><span>03</span><span>Triangulator</span></div>
      <div class="frame"><span>04</span><span>Study Hall</span></div>
      <div class="frame"><span>05</span><span>Mockingbird</span></div>
    </aside>
    <figure class="plate">
      <img src="../../../public/gamezilla-app-screenshot.optimized.webp" alt="gamezilla.app screenshot">
      <div class="circle"></div>
      <figcaption class="cap">gamezilla.app</figcaption>
    </figure>
    <p class="margin"><b>Chris Vouga · Phoenix</b><span>crvouga@gmail.com · Copy · Resume</span></p>
  </main>
</body>
</html>
