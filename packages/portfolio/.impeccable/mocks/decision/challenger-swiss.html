<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Poster wall — first viewport</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=Archivo:wght@400;600&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; }
  .poster {
    width: 1440px; height: 900px; background: #f6f5f1; color: #141414;
    display: grid; grid-template-columns: 1.1fr 0.9fr; grid-template-rows: 72px 1fr 80px;
    font-family: Archivo, sans-serif;
  }
  nav { grid-column: 1 / -1; display: flex; gap: 32px; align-items: center; padding: 0 36px; font-size: 16px; }
  nav .on { color: #e10600; font-weight: 600; }
  .type { padding: 12px 36px 0; }
  h1 {
    font-family: "Archivo Narrow", sans-serif; font-weight: 700; font-size: 108px;
    line-height: 0.86; letter-spacing: -0.03em;
  }
  .bar { width: 180px; height: 16px; background: #e10600; margin: 22px 0; }
  p { font-size: 22px; max-width: 28ch; line-height: 1.35; }
  figure { overflow: hidden; background: #141414; margin: 12px 36px 0 0; }
  figure img { width: 100%; height: 100%; object-fit: cover; display: block; }
  footer {
    grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center;
    padding: 0 36px; font-size: 18px;
  }
</style>
</head>
<body>
  <article class="poster">
    <nav><span class="on">Work</span><span>Projects</span><span>How I build</span><span>Contact</span></nav>
    <div class="type">
      <h1>gamezilla.app</h1>
      <div class="bar"></div>
      <p>Real-time multiplayer. TypeScript, WebSockets, no flag day. Chris Vouga, Phoenix.</p>
    </div>
    <figure><img src="../../../public/gamezilla-app-screenshot.optimized.webp" alt="gamezilla.app screenshot"></figure>
    <footer><span>crvouga@gmail.com</span><span>Resume</span></footer>
  </article>
</body>
</html>
